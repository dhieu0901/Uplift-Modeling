[project]
name = "honest-uplift"
version = "1.0.0"
description = "Does uplift targeting beat response targeting at a fixed campaign budget?"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
# Anchored to the repository root with a leading slash. Without it, "data"
# matches any directory of that name at any depth, which silently excluded
# src/data/ from every lint run including the one CI gates on.
extend-exclude = ["/.venv", "/data", "/outputs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplifications
    "PTH",  # prefer pathlib over os.path
    "NPY",  # numpy legacy API
    "PD",   # pandas anti-patterns
    "RUF",
]
ignore = [
    # Counts are wrapped in an explicit `int()` on purpose. Callers may pass
    # numpy scalars, and `round()` on a numpy float returns a numpy float, so
    # the cast is a guard rather than redundancy.
    "RUF046",
]

[tool.ruff.lint.per-file-ignores]
# A notebook has to put the repository root on sys.path before it can import
# from src, so its project imports cannot sit at the top of the cell. The
# scripts solve this with a file-level noqa; doing it here keeps the notebooks
# free of lint directives a reader would have to skip past.
"notebooks/*.ipynb" = ["E402"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["src"]

[tool.ty.src]
# This project uses a flat layout: `src` is an ordinary package imported as
# `src.*` from the repository root, not a src-layout import root. Without this,
# type checkers infer `src/` as the root and fail to resolve `src.reporting`.
root = "."

[tool.pyright]
extraPaths = ["."]
typeCheckingMode = "standard"

# Type checking is not a gate in this project; ruff, the test suite, and CI are.
# What this section does is keep the editor's Problems panel worth reading.
#
# pandas 3 and numpy 2 annotate ordinary operations with wide unions. `df[col]`
# is a Series or an Index or a DatetimeIndex or an ExtensionArray, so calling
# anything Series-shaped on the result is an error against every member but
# one. Run over this repository, the rules below produced 315 diagnostics and
# zero defects. Every category was read: `sys.stdout.reconfigure` behind its
# own `hasattr` guard, `int()` on a value pandas types as a union,
# `sort_values` failing overload resolution, `fetchone()[0]` on a
# `SELECT count(*)`. A signal with no true positives does not just waste
# attention, it buries the signals that have some, so these are turned off by
# name rather than left to be ignored by habit.
#
# By name, and not by dropping the whole mode to "off", because the rules that
# do not depend on third-party stubs still catch real mistakes and stay on:
# undefined names, unresolved imports, unreachable code, a redeclared symbol, a
# method missing its `self`.
#
# The one diagnostic that was about this code was fixed instead of suppressed.
# `BaseLearnerFamily.classifier` was typed `Callable[[int], Any]` while every
# implementation defaults the seed and one caller depends on that default; it
# is a Protocol saying so now. See `src/models/base.py`.
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportIndexIssue = "none"
reportOperatorIssue = "none"
reportOptionalMemberAccess = "none"
reportOptionalSubscript = "none"
reportReturnType = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import the project as `src.*` from the repository root. `python -m pytest`
# puts the working directory on sys.path but the bare `pytest` entry point does
# not, so without this the suite passes locally and fails in CI.
pythonpath = ["."]
# Test caching is disabled because it writes into the repository root, which is
# not always writable on the machines this project runs on.
addopts = "-q -p no:cacheprovider"
